name: Build GBA-MAX
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Baixar libretro.h e core mGBA
        run: |
          curl -fL -o app/src/main/cpp/libretro.h https://raw.githubusercontent.com/libretro/RetroArch/master/libretro-common/include/libretro.h
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            curl -fL -o core_$abi.zip https://buildbot.libretro.com/nightly/android/latest/$abi/mgba_libretro_android.so.zip
            unzip -o core_$abi.zip -d tmp_$abi
            mv tmp_$abi/mgba_libretro_android.so app/src/main/jniLibs/$abi/libmgba_core.so
          done
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GBA-MAX
          path: app/build/outputs/apk/debug/*.apk

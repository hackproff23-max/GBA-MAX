plugins { id 'com.android.application' }
android {
    namespace 'org.gbamax.emu'
    compileSdk 34
    defaultConfig {
        applicationId 'org.gbamax.emu'
        minSdk 24
        targetSdk 34
        // sobe sozinho a cada build do GitHub Actions, para instalar por cima sempre
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    // chave FIXA: todo APK sai com a mesma assinatura e instala por cima do anterior
    signingConfigs {
        fixa {
            storeFile file('gba-max.jks')
            storePassword 'gbamax123'
            keyAlias 'gbamax'
            keyPassword 'gbamax123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixa }
        release { signingConfig signingConfigs.fixa }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
}
